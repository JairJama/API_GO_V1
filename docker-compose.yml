services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: "${HTTP_ADDR:-:8080}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      BCRYPT_COST: "${BCRYPT_COST:-12}"
      SESSION_TTL: "${SESSION_TTL:-12h}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_ENV: "${APP_ENV:-development}"
      PASSWORD_RESET_TTL: "${PASSWORD_RESET_TTL:-1h}"
      PASSWORD_RESET_URL_BASE: "${PASSWORD_RESET_URL_BASE:-http://localhost:8080}"
      API_TOKEN_PEPPER: "${API_TOKEN_PEPPER:?API_TOKEN_PEPPER must be set}"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-go_security_api}"
      POSTGRES_USER: "${POSTGRES_USER:-go_api}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_api -d go_security_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
