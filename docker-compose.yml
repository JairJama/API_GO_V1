services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://go_api:go_api_dev@postgres:5432/go_security_api?sslmode=disable"
      BCRYPT_COST: "12"
      SESSION_TTL: "12h"
      COOKIE_SECURE: "false"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: go_security_api
      POSTGRES_USER: go_api
      POSTGRES_PASSWORD: go_api_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_api -d go_security_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
